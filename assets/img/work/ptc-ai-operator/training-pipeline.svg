<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8b84b"/>
    </marker>
    <marker id="arrDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8f8c80"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#0e0d0a"/>
  <!-- faint grid -->
  <g stroke="#f1efe6" stroke-opacity="0.03">
    <path d="M0 150 H1600 M0 300 H1600 M0 450 H1600 M0 600 H1600 M0 750 H1600"/>
    <path d="M200 0 V900 M400 0 V900 M600 0 V900 M800 0 V900 M1000 0 V900 M1200 0 V900 M1400 0 V900"/>
  </g>

  <!-- header -->
  <text x="70" y="78" fill="#e8b84b" font-size="15" letter-spacing="5">HOW THE OPERATOR WAS TRAINED</text>
  <text x="70" y="120" fill="#f1efe6" font-size="34" font-weight="700" letter-spacing="1">3,200 REAL CALLS → ONE SCRIPT THAT WINS</text>
  <text x="1530" y="78" fill="#8f8c80" font-size="13" letter-spacing="3" text-anchor="end">PTC AI OPERATOR — TRAINING PIPELINE</text>
  <path d="M70 145 H1530" stroke="#f1efe6" stroke-opacity="0.12"/>

  <!-- pipeline stages -->
  <!-- stage 1 : SOURCE -->
  <g>
    <rect x="70" y="210" width="256" height="240" rx="14" fill="#15130c" stroke="#e8b84b" stroke-opacity="0.28" stroke-width="8"/>
    <rect x="70" y="210" width="256" height="240" rx="14" fill="none" stroke="#e8b84b" stroke-opacity="0.75" stroke-width="2"/>
    <text x="94" y="248" fill="#e8b84b" font-size="13" letter-spacing="3">01 · SOURCE</text>
    <text x="94" y="290" fill="#f1efe6" font-size="24" font-weight="700">CALL TRACKING</text>
    <text x="94" y="330" fill="#e8b84b" font-size="30" font-weight="700">3,200 calls</text>
    <text x="94" y="362" fill="#8f8c80" font-size="15">recorded + labeled with</text>
    <text x="94" y="386" fill="#8f8c80" font-size="15">real outcomes per call —</text>
    <text x="94" y="410" fill="#8f8c80" font-size="15">booked · lost · callback</text>
  </g>
  <path d="M330 330 H384" stroke="#e8b84b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- stage 2 : HARVEST -->
  <g>
    <rect x="392" y="210" width="256" height="240" rx="14" fill="#15130c" stroke="#e8b84b" stroke-opacity="0.28" stroke-width="8"/>
    <rect x="392" y="210" width="256" height="240" rx="14" fill="none" stroke="#e8b84b" stroke-opacity="0.75" stroke-width="2"/>
    <text x="416" y="248" fill="#e8b84b" font-size="13" letter-spacing="3">02 · HARVEST</text>
    <text x="416" y="290" fill="#f1efe6" font-size="24" font-weight="700">PLAYWRIGHT</text>
    <text x="416" y="318" fill="#f1efe6" font-size="24" font-weight="700">HARVESTER</text>
    <text x="416" y="356" fill="#8f8c80" font-size="15">headless automation:</text>
    <text x="416" y="380" fill="#8f8c80" font-size="15">recon + full harvest,</text>
    <text x="416" y="404" fill="#8f8c80" font-size="15">survives deep pagination,</text>
    <text x="416" y="428" fill="#8f8c80" font-size="15">idempotent re-runs</text>
  </g>
  <path d="M652 330 H706" stroke="#e8b84b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- stage 3 : CORPUS -->
  <g>
    <rect x="714" y="210" width="256" height="240" rx="14" fill="#15130c" stroke="#e8b84b" stroke-opacity="0.28" stroke-width="8"/>
    <rect x="714" y="210" width="256" height="240" rx="14" fill="none" stroke="#e8b84b" stroke-opacity="0.75" stroke-width="2"/>
    <text x="738" y="248" fill="#e8b84b" font-size="13" letter-spacing="3">03 · CORPUS</text>
    <text x="738" y="290" fill="#f1efe6" font-size="24" font-weight="700">TRANSCRIPTS</text>
    <text x="738" y="330" fill="#e8b84b" font-size="27" font-weight="700">79 full calls</text>
    <text x="738" y="362" fill="#8f8c80" font-size="15">wins AND losses, verbatim:</text>
    <text x="738" y="386" fill="#8f8c80" font-size="15">39 booked · 40 lost,</text>
    <text x="738" y="410" fill="#8f8c80" font-size="15">read line by line</text>
  </g>
  <path d="M974 330 H1028" stroke="#e8b84b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- stage 4 : MINING -->
  <g>
    <rect x="1036" y="210" width="256" height="240" rx="14" fill="#15130c" stroke="#e8b84b" stroke-opacity="0.28" stroke-width="8"/>
    <rect x="1036" y="210" width="256" height="240" rx="14" fill="none" stroke="#e8b84b" stroke-opacity="0.75" stroke-width="2"/>
    <text x="1060" y="248" fill="#e8b84b" font-size="13" letter-spacing="3">04 · PATTERN MINING</text>
    <text x="1060" y="290" fill="#f1efe6" font-size="24" font-weight="700">WHAT WINS,</text>
    <text x="1060" y="318" fill="#f1efe6" font-size="24" font-weight="700">WHAT KILLS</text>
    <text x="1060" y="356" fill="#8f8c80" font-size="14">script beats as performed</text>
    <text x="1060" y="380" fill="#8f8c80" font-size="14">objections ranked by freq</text>
    <text x="1060" y="404" fill="#8f8c80" font-size="14">phonetic email readbacks</text>
    <text x="1060" y="428" fill="#8f8c80" font-size="14">timezone math · loss lines</text>
  </g>
  <path d="M1296 330 H1350" stroke="#e8b84b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- stage 5 : AGENT -->
  <g>
    <rect x="1358" y="210" width="172" height="240" rx="14" fill="#1a160c" stroke="#e8b84b" stroke-opacity="0.5" stroke-width="10"/>
    <rect x="1358" y="210" width="172" height="240" rx="14" fill="none" stroke="#e8b84b" stroke-width="2.5"/>
    <text x="1382" y="248" fill="#e8b84b" font-size="13" letter-spacing="3">05 · AGENT</text>
    <text x="1382" y="290" fill="#f1efe6" font-size="24" font-weight="700">VOICE AI</text>
    <text x="1382" y="318" fill="#f1efe6" font-size="24" font-weight="700">OPERATOR</text>
    <text x="1382" y="356" fill="#8f8c80" font-size="15">system prompt =</text>
    <text x="1382" y="380" fill="#8f8c80" font-size="15">mined beats +</text>
    <text x="1382" y="404" fill="#8f8c80" font-size="15">hard rules, 24/7</text>
  </g>

  <!-- feedback loop -->
  <path d="M1444 450 V520 H842 V456" stroke="#8f8c80" stroke-width="2" stroke-dasharray="6 7" fill="none" marker-end="url(#arrDim)"/>
  <text x="1143" y="508" fill="#8f8c80" font-size="14" letter-spacing="2" text-anchor="middle">FEEDBACK LOOP — TEST CALLS → TRANSCRIPT REVIEW → PROMPT v(n+1)</text>

  <!-- hard rules strip -->
  <g>
    <text x="70" y="592" fill="#e8b84b" font-size="13" letter-spacing="4">HARD RULES COMPILED INTO THE PROMPT</text>
    <g font-size="14" fill="#c9c6ba">
      <rect x="70"  y="612" width="286" height="44" rx="22" fill="none" stroke="#f1efe6" stroke-opacity="0.16"/>
      <text x="213" y="639" text-anchor="middle">ONLY OFFER TOOL-RETURNED TIMES</text>
      <rect x="372" y="612" width="266" height="44" rx="22" fill="none" stroke="#f1efe6" stroke-opacity="0.16"/>
      <text x="505" y="639" text-anchor="middle">SPELL-BACK BEFORE BOOKING</text>
      <rect x="654" y="612" width="216" height="44" rx="22" fill="none" stroke="#f1efe6" stroke-opacity="0.16"/>
      <text x="762" y="639" text-anchor="middle">NEVER INVENT PRICES</text>
      <rect x="886" y="612" width="256" height="44" rx="22" fill="none" stroke="#f1efe6" stroke-opacity="0.16"/>
      <text x="1014" y="639" text-anchor="middle">NEVER ARGUE A DECLINE</text>
      <rect x="1158" y="612" width="372" height="44" rx="22" fill="none" stroke="#f1efe6" stroke-opacity="0.16"/>
      <text x="1344" y="639" text-anchor="middle">CONSENT + AI DISCLOSURE, EVERY GREETING</text>
    </g>
  </g>

  <!-- benchmark meter -->
  <g>
    <text x="70" y="738" fill="#e8b84b" font-size="13" letter-spacing="4">THE BAR IT REPORTS AGAINST — MEASURED BEFORE THE AI TOOK A SINGLE CALL</text>
    <rect x="70" y="762" width="1460" height="16" rx="8" fill="#f1efe6" fill-opacity="0.07"/>
    <rect x="70" y="762" width="613" height="16" rx="8" fill="#e8b84b" fill-opacity="0.85"/>
    <path d="M683 750 V792" stroke="#e8b84b" stroke-width="2.5"/>
    <text x="683" y="822" fill="#f1efe6" font-size="16" font-weight="700" text-anchor="middle">HUMAN OPERATORS · 42% OF ANSWERED CALLS BOOKED</text>
    <text x="70" y="822" fill="#8f8c80" font-size="14">BUSINESS HOURS ONLY</text>
    <text x="1530" y="822" fill="#8f8c80" font-size="14" text-anchor="end">AI: 24/7 · COST PER CALL ~6× LOWER · TRACKED LIVE ON THE OWNER DASHBOARD</text>
  </g>

  <path d="M70 862 H1530" stroke="#f1efe6" stroke-opacity="0.12"/>
  <text x="70" y="888" fill="#8f8c80" font-size="12" letter-spacing="3">EVERY NUMBER ABOVE IS MEASURED, NOT ESTIMATED</text>
  <text x="1530" y="888" fill="#e8b84b" font-size="12" letter-spacing="3" text-anchor="end">FAISELTAJIRAN.COM</text>
</svg>
