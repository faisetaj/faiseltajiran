<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <rect width="1600" height="900" fill="#0e0a0e"/>
  <g stroke="#f1efe6" stroke-opacity="0.03">
    <path d="M0 150 H1600 M0 300 H1600 M0 450 H1600 M0 600 H1600 M0 750 H1600"/>
    <path d="M200 0 V900 M400 0 V900 M600 0 V900 M800 0 V900 M1000 0 V900 M1200 0 V900 M1400 0 V900"/>
  </g>

  <!-- header -->
  <text x="70" y="78" fill="#ff2bd6" font-size="15" letter-spacing="5">WHAT THE PILOT LINE RECOVERED — FIVE WEEKS, FIRST TENANT</text>
  <text x="70" y="120" fill="#f1efe6" font-size="34" font-weight="700" letter-spacing="1">246 CALLS NO OPERATOR WAS FREE TO TAKE → 67 APPOINTMENTS</text>
  <text x="1530" y="78" fill="#8f8c80" font-size="13" letter-spacing="3" text-anchor="end">DOPPELDESK — PROVE STAGE</text>
  <path d="M70 145 H1530" stroke="#f1efe6" stroke-opacity="0.12"/>

  <!-- LEFT: the funnel -->
  <text x="70" y="196" fill="#ff2bd6" font-size="13" letter-spacing="4">ROLLOVER + AFTER-HOURS CALLS ONLY · 08-31 → 10-03</text>

  <g>
    <rect x="70" y="222" width="820" height="58" rx="10" fill="#ff2bd6" fill-opacity="0.85"/>
    <text x="92" y="259" fill="#0e0a0e" font-size="24" font-weight="700">246</text>
    <text x="160" y="259" fill="#0e0a0e" font-size="15" letter-spacing="1.5">REAL CALLS — OPERATORS BUSY, NO ANSWER, OR AFTER HOURS</text>
  </g>
  <g>
    <rect x="70" y="296" width="617" height="58" rx="10" fill="#ff2bd6" fill-opacity="0.6"/>
    <text x="92" y="333" fill="#f1efe6" font-size="24" font-weight="700">185</text>
    <text x="160" y="333" fill="#f1efe6" font-size="15" letter-spacing="1.5">VERIFIED — MAIL CODE CHECKED, OR BOOKED</text>
  </g>
  <g>
    <rect x="70" y="370" width="223" height="58" rx="10" fill="#ff2bd6" fill-opacity="0.4"/>
    <text x="92" y="407" fill="#f1efe6" font-size="24" font-weight="700">67</text>
    <text x="316" y="400" fill="#f1efe6" font-size="15" letter-spacing="1.5">APPOINTMENTS SET — 36.2% OF VERIFIED</text>
    <text x="316" y="420" fill="#8f8c80" font-size="13">counted when made, in the real booking system, even if later cancelled</text>
  </g>
  <g>
    <rect x="70" y="444" width="80" height="58" rx="10" fill="#ff2bd6" fill-opacity="0.28"/>
    <text x="92" y="481" fill="#f1efe6" font-size="24" font-weight="700">24</text>
    <text x="316" y="474" fill="#f1efe6" font-size="15" letter-spacing="1.5">SHOWED — 35.8% OF SETS</text>
    <text x="316" y="494" fill="#8f8c80" font-size="13">20 no-show · 15 cancelled · 5 still booked at the pull</text>
  </g>
  <g>
    <rect x="70" y="518" width="26" height="58" rx="10" fill="#ff2bd6" fill-opacity="0.2"/>
    <text x="112" y="555" fill="#f1efe6" font-size="24" font-weight="700">4</text>
    <text x="316" y="548" fill="#f1efe6" font-size="15" letter-spacing="1.5">SALES</text>
    <text x="316" y="568" fill="#8f8c80" font-size="13">small sample; reported as counted, not projected</text>
  </g>

  <!-- RIGHT: set rate by mail age -->
  <text x="950" y="196" fill="#ff2bd6" font-size="13" letter-spacing="4">SET RATE BY AGE OF THE CALLER'S MAIL PIECE</text>
  <text x="950" y="218" fill="#8f8c80" font-size="13">the board separates the operator from the lead source</text>

  <g font-size="14">
    <text x="950" y="262" fill="#f1efe6">0–7 DAYS</text>
    <rect x="1090" y="246" width="440" height="22" rx="4" fill="#f1efe6" fill-opacity="0.07"/>
    <rect x="1090" y="246" width="412" height="22" rx="4" fill="#ff2bd6" fill-opacity="0.85"/>
    <text x="1098" y="262" fill="#0e0a0e" font-weight="700">46.9% · 30 of 64</text>

    <text x="950" y="312" fill="#f1efe6">8–14 DAYS</text>
    <rect x="1090" y="296" width="440" height="22" rx="4" fill="#f1efe6" fill-opacity="0.07"/>
    <rect x="1090" y="296" width="269" height="22" rx="4" fill="#ff2bd6" fill-opacity="0.6"/>
    <text x="1098" y="312" fill="#f1efe6" font-weight="700">30.6% · 19 of 62</text>

    <text x="950" y="362" fill="#f1efe6">15–21 DAYS</text>
    <rect x="1090" y="346" width="440" height="22" rx="4" fill="#f1efe6" fill-opacity="0.07"/>
    <rect x="1090" y="346" width="207" height="22" rx="4" fill="#ff2bd6" fill-opacity="0.45"/>
    <text x="1098" y="362" fill="#f1efe6" font-weight="700">23.5% · 4 of 17</text>

    <text x="950" y="412" fill="#f1efe6">22–35 DAYS</text>
    <rect x="1090" y="396" width="440" height="22" rx="4" fill="#f1efe6" fill-opacity="0.07"/>
    <rect x="1090" y="396" width="110" height="22" rx="4" fill="#ff2bd6" fill-opacity="0.3"/>
    <text x="1210" y="412" fill="#f1efe6" font-weight="700">12.5% · 1 of 8</text>
  </g>

  <rect x="950" y="456" width="580" height="128" rx="14" fill="#170d16" stroke="#ff2bd6" stroke-opacity="0.4" stroke-width="2"/>
  <text x="974" y="488" fill="#ff2bd6" font-size="13" letter-spacing="3">FRESH MAIL, FIRST WEEKS</text>
  <text x="974" y="524" fill="#f1efe6" font-size="26" font-weight="700">52.0% set rate</text>
  <text x="974" y="548" fill="#8f8c80" font-size="14">26 of 50 verified calls · mail ≤ 7 days old · through 09-10;</text>
  <text x="974" y="568" fill="#8f8c80" font-size="14">then a two-week gap in mail drops aged every lead the line got</text>

  <!-- the bar -->
  <g>
    <text x="70" y="648" fill="#ff2bd6" font-size="13" letter-spacing="4">THE BAR IT IS MEASURED AGAINST — THE OWNER'S OWN OPERATORS, NOT AN INDUSTRY AVERAGE</text>
    <rect x="70" y="672" width="1460" height="16" rx="8" fill="#f1efe6" fill-opacity="0.07"/>
    <rect x="70" y="672" width="613" height="16" rx="8" fill="#f1efe6" fill-opacity="0.55"/>
    <path d="M683 660 V702" stroke="#f1efe6" stroke-width="2.5"/>
    <text x="683" y="732" fill="#f1efe6" font-size="16" font-weight="700" text-anchor="middle">HUMAN OPERATORS · 42% OF EVERY CALL THAT COMES IN · 47% OF THE CALLS THEY ANSWER</text>
    <text x="70" y="732" fill="#8f8c80" font-size="14">~110 CALLS A DAY</text>
    <text x="1530" y="732" fill="#8f8c80" font-size="14" text-anchor="end">OPERATORS GET FIRST PICK IN ROOM HOURS</text>
  </g>

  <!-- honesty strip -->
  <g font-size="13" fill="#c9c6ba">
    <rect x="70"   y="776" width="338" height="44" rx="22" fill="none" stroke="#f1efe6" stroke-opacity="0.16"/>
    <text x="239"  y="803" text-anchor="middle">NOT LIKE-FOR-LIKE UNTIL A TRUE CUTOVER</text>
    <rect x="438"  y="776" width="330" height="44" rx="22" fill="none" stroke="#f1efe6" stroke-opacity="0.16"/>
    <text x="603"  y="803" text-anchor="middle">NEVER "BEATS THE HUMANS" ON THIS DATA</text>
    <rect x="798"  y="776" width="314" height="44" rx="22" fill="none" stroke="#f1efe6" stroke-opacity="0.16"/>
    <text x="955"  y="803" text-anchor="middle">TEST CALLS EXCLUDED · NO CALLER DATA</text>
    <rect x="1142" y="776" width="388" height="44" rx="22" fill="none" stroke="#f1efe6" stroke-opacity="0.16"/>
    <text x="1336" y="803" text-anchor="middle">RECOMPUTED FROM THE DATABASE, READ-ONLY</text>
  </g>

  <path d="M70 862 H1530" stroke="#f1efe6" stroke-opacity="0.12"/>
  <text x="70" y="888" fill="#8f8c80" font-size="12" letter-spacing="3">AGGREGATE NUMBERS FROM THE FIRST TENANT'S PILOT · PULLED 2026-10-03</text>
  <text x="1530" y="888" fill="#ff2bd6" font-size="12" letter-spacing="3" text-anchor="end">FAISELTAJIRAN.COM</text>
</svg>
